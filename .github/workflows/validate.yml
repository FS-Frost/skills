name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate skills and index
        run: node scripts/validate.js
      - name: Check JS scripts syntax
        run: |
          node --check scripts/install.js
          node --check scripts/uninstall.js
          node --check scripts/validate.js
      - name: Smoke test — install --list
        run: node scripts/install.js --list
